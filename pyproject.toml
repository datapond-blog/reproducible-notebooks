[project]
name = "reproducible-notebook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Florent Devin", email = "florent.devin@dataiku.com" }
]
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.1",
    "numpy>=2.5.4",
    "opentelemetry-proto>=1.45.1",
    "plotly>=7.1.0",
    "polars>=2.0.0",
]

[project.scripts]
reproducible-notebook = "reproducible_notebook:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
